<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minion & Clara 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff5f7; --card:#ffffff; --pink:#ff8fab; --pink-d:#f06b8e; --rose:#ffc2d1;
    --text:#5a3d4a; --muted:#9b7f8b; --env:#ffd6e0; --env-d:#ffb3c6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Nunito',sans-serif; color:var(--text); min-height:100vh;
    background:radial-gradient(circle at 20% 10%,#ffe3ea 0,transparent 40%),
               radial-gradient(circle at 85% 80%,#ffe9f0 0,transparent 45%),var(--bg);
    padding:20px 16px 100px; overflow-x:hidden;
  }
  .wrap{max-width:560px;margin:0 auto}
  .lang{display:flex;justify-content:flex-end;gap:6px;margin-bottom:10px}
  .lang button{
    font:600 13px 'Nunito';border:2px solid var(--rose);background:#fff;color:var(--muted);
    padding:6px 12px;border-radius:999px;cursor:pointer;transition:.2s
  }
  .lang button.on{background:var(--pink);border-color:var(--pink);color:#fff}
  h1{font-family:'Mali',cursive;font-size:36px;font-weight:700;text-align:center;color:var(--pink-d);line-height:1.3}
  .sub{text-align:center;color:var(--muted);margin:6px 0 20px;font-weight:500}
  .card{background:var(--card);border-radius:22px;padding:20px;box-shadow:0 6px 24px rgba(240,107,142,.12);margin-bottom:18px}
  .card h2{font-size:16px;font-weight:700;text-align:center;margin-bottom:12px;color:var(--pink-d)}
  .hint{text-align:center;color:var(--muted);font-size:13px;margin-top:10px}
  .page{display:none;animation:fade .3s ease}
  .page.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  nav{
    position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:5;
    background:#fff;border-radius:999px;box-shadow:0 6px 24px rgba(240,107,142,.22);
    display:flex;gap:2px;padding:6px;max-width:calc(100% - 20px)
  }
  nav a{
    text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:700;font-style:normal;
    display:flex;flex-direction:column;align-items:center;padding:6px 7px;border-radius:999px;min-width:48px
  }
  nav a em{font-style:normal}
  nav a span{font-size:20px;line-height:1.1}
  nav a.on{background:var(--bg);color:var(--pink-d)}

  .count{display:flex;justify-content:center;gap:10px}
  .unit{background:var(--bg);border-radius:14px;padding:10px 0;width:74px;text-align:center}
  .unit b{display:block;font-size:26px;color:var(--pink-d)}
  .unit span{font-size:12px;color:var(--muted)}
  .countdone{text-align:center;font-size:18px;font-weight:700;color:var(--pink-d)}
  .miss{text-align:center}
  .btn{
    font:700 18px 'Nunito';color:#fff;background:linear-gradient(135deg,var(--pink),var(--pink-d));
    border:none;border-radius:999px;padding:16px 30px;cursor:pointer;
    box-shadow:0 6px 16px rgba(240,107,142,.35);transition:transform .15s
  }
  .btn:active{transform:scale(.94)}
  .btn.sm{font-size:15px;padding:11px 22px}
  #missMsg{min-height:48px;margin-top:14px;font-weight:600}
  #missCount{font-size:15px;color:var(--pink-d);font-weight:700;margin-top:4px}
  #missCount b{font-size:22px}

  .envs{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .env{
    position:relative;background:var(--env);border-radius:10px;aspect-ratio:1.45;cursor:pointer;
    overflow:hidden;transition:transform .2s;border:none;font-family:inherit;color:var(--text)
  }
  .env:hover{transform:translateY(-3px) rotate(-1deg)}
  .env::before{
    content:"";position:absolute;inset:0 0 auto 0;height:58%;background:var(--env-d);
    clip-path:polygon(0 0,100% 0,50% 100%);transition:.3s
  }
  .env.opened::before{opacity:.35}
  .env .seal{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);font-size:22px;z-index:1}
  .env .lbl{position:absolute;bottom:8px;left:6px;right:6px;font-size:12.5px;font-weight:700;text-align:center;line-height:1.25}

  .reason{
    min-height:170px;display:flex;align-items:center;justify-content:center;text-align:center;
    background:linear-gradient(135deg,#fff0f4,#ffe3ea);border-radius:18px;padding:24px;
    font-size:19px;font-weight:600;line-height:1.5;cursor:pointer;user-select:none
  }
  .reason.flip{animation:flip .45s ease}
  @keyframes flip{0%{transform:rotateY(0)}50%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
  .reason small{display:block;font-size:13px;color:var(--muted);margin-bottom:8px;font-weight:700}

  .coupons{display:flex;flex-direction:column;gap:12px}
  .coupon{display:flex;align-items:center;gap:12px;background:#fff7e8;border:2px dashed #f7c58f;border-radius:14px;padding:12px 14px}
  .coupon .ico{font-size:28px}
  .coupon .txt{flex:1;font-weight:600;font-size:14.5px;line-height:1.35}
  .coupon button{font:700 13px 'Nunito';border:none;border-radius:999px;padding:8px 12px;cursor:pointer;background:var(--pink);color:#fff;white-space:nowrap}
  .coupon button.sure{background:#f7a24b}
  .coupon.used{opacity:.55;background:#f5f0f2;border-color:#ddd}
  .coupon.used button{background:#bbb;cursor:default}

  .gtabs{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
  .gtabs button{font:700 14px 'Nunito';border:2px solid var(--rose);background:#fff;color:var(--muted);padding:8px 14px;border-radius:999px;cursor:pointer}
  .gtabs button.on{background:var(--pink);border-color:var(--pink);color:#fff}
  .field{position:relative;max-width:380px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;background:linear-gradient(#e8f7d4,#cfeeb0);border-radius:18px;padding:16px 12px;user-select:none;-webkit-user-select:none}
  .hole{position:relative;aspect-ratio:1;overflow:hidden;container-type:inline-size;border-radius:0 0 50% 50%/0 0 30% 30%}
  .hole::after{content:"";position:absolute;left:6%;right:6%;bottom:0;height:34%;background:#8d6448;border-radius:50%;box-shadow:inset 0 6px 0 #6b4a34;z-index:2}
  .critter{position:absolute;left:0;right:0;bottom:20%;font-size:52cqw;text-align:center;transform:translateY(170%);transition:transform .16s ease-out;z-index:1;cursor:pointer;line-height:1}
  .critter.up{transform:translateY(0)}
  .critter.fed{animation:wiggle .35s ease}
  @keyframes wiggle{0%,100%{rotate:0deg}25%{rotate:-12deg}75%{rotate:12deg}}
  .pig{position:relative;display:inline-block}
  .pig .bow{position:absolute;top:-14%;left:52%;font-size:.48em;rotate:18deg}
  .flyb{position:absolute;left:50%;bottom:0;font-size:30cqw;z-index:4;pointer-events:none;animation:flyb .35s ease-out forwards}
  @keyframes flyb{from{transform:translate(-50%,40%) rotate(-40deg);opacity:1}to{transform:translate(-50%,-150%) rotate(25deg);opacity:0}}
  .decor{position:absolute;font-size:18px;opacity:.55;pointer-events:none;z-index:0}
  .hole .bubble{position:absolute;top:2px;left:0;right:0;text-align:center;font-weight:800;font-size:13px;color:var(--pink-d);z-index:3;pointer-events:none;animation:rise .8s ease-out forwards}
  @keyframes rise{from{opacity:1;transform:translateY(10px)}to{opacity:0;transform:translateY(-14px)}}
  #game{width:100%;height:380px;display:block;border-radius:16px;background:linear-gradient(#fff0f4,#ffe3ea);touch-action:none}
  .gamebar{display:flex;justify-content:space-between;font-weight:700;margin-bottom:10px;color:var(--pink-d)}
  .gameover{text-align:center;margin-top:12px;font-weight:600;min-height:24px}

  .modal{position:fixed;inset:0;background:rgba(90,61,74,.35);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
  .modal.show{display:flex}
  .letter{
    background:#fffdf8;border-radius:18px;max-width:420px;width:100%;padding:28px 24px 22px;position:relative;
    box-shadow:0 12px 40px rgba(0,0,0,.18);animation:pop .35s ease;
    background-image:repeating-linear-gradient(#fffdf8 0 31px,#ffe3ea 31px 32px)
  }
  @keyframes pop{from{transform:scale(.7) translateY(30px);opacity:0}to{transform:none;opacity:1}}
  .letter h3{font-family:'Mali',cursive;font-size:24px;font-weight:700;color:var(--pink-d);margin-bottom:10px}
  .letter p{font-family:'Mali',cursive;font-size:16px;line-height:32px;white-space:pre-line}
  .letter .sign{font-family:'Mali',cursive;font-size:19px;font-weight:600;text-align:right;margin-top:8px;color:var(--pink-d)}
  .close{position:absolute;top:10px;right:14px;background:none;border:none;font-size:24px;color:var(--muted);cursor:pointer}
  .heart{position:fixed;pointer-events:none;font-size:22px;animation:float 1.6s ease-out forwards;z-index:20}
  @keyframes float{to{transform:translate(var(--dx),-180px) scale(1.4);opacity:0}}
  .album{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .polaroid{background:#fff;padding:8px 8px 10px;border-radius:6px;box-shadow:0 4px 14px rgba(90,61,74,.15);cursor:pointer;border:none;font-family:inherit;color:var(--text);text-align:center;transition:transform .2s}
  .polaroid:nth-child(odd){transform:rotate(-1.5deg)}
  .polaroid:nth-child(even){transform:rotate(1.5deg)}
  .polaroid:hover{transform:rotate(0) scale(1.03)}
  .polaroid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:3px;display:block;background:#ffe3ea}
  .polaroid span{display:block;font-family:'Mali',cursive;font-size:14px;font-weight:600;margin-top:6px;line-height:1.3}
  .polaroid small{display:block;font-size:11px;color:var(--muted)}
  .albumMsg{text-align:center;color:var(--muted);padding:20px 0}
  .lightbox{position:fixed;inset:0;background:rgba(40,20,30,.88);display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:15}
  .lightbox.show{display:flex}
  .lightbox img{max-width:100%;max-height:75vh;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
  .lightbox .cap{color:#fff;font-family:'Mali',cursive;font-size:19px;font-weight:600;margin-top:12px;text-align:center}
  .lightbox .cap small{display:block;font-family:'Nunito';font-size:13px;opacity:.7}
  .lightbox .close{color:#fff;font-size:32px;top:14px;right:18px}
  .lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.2);border:none;color:#fff;font-size:28px;width:44px;height:44px;border-radius:50%;cursor:pointer}
  .lb-prev{left:10px}.lb-next{right:10px}
  footer{text-align:center;color:var(--muted);font-size:13px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="lang">
    <button data-l="vi">Tiếng Việt</button>
    <button data-l="en">English</button>
  </div>

  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>

  <section class="page" id="p-home">
    <div class="card">
      <h2 data-t="cdTitle"></h2>
      <div id="countdown"></div>
    </div>
    <div class="card miss">
      <button class="btn" id="missBtn"></button>
      <div id="missMsg"></div>
      <div id="missCount"></div>
    </div>
  </section>

  <section class="page" id="p-thu">
    <div class="card">
      <h2 data-t="envTitle"></h2>
      <div class="envs" id="envs"></div>
    </div>
  </section>

  <section class="page" id="p-lydo">
    <div class="card">
      <h2 data-t="rTitle"></h2>
      <div class="reason" id="reason"></div>
      <p class="hint" data-t="rHint"></p>
    </div>
  </section>

  <section class="page" id="p-phieu">
    <div class="card">
      <h2 data-t="cTitle"></h2>
      <div class="coupons" id="coupons"></div>
      <p class="hint" data-t="cHint"></p>
    </div>
  </section>

  <section class="page" id="p-game">
    <div class="gtabs">
      <button data-g="2" data-t="gTab2"></button>
      <button data-g="1" data-t="gTab1"></button>
    </div>
    <div class="card" id="g2card">
      <h2 data-t="g2Title"></h2>
      <div class="gamebar"><span id="g2Score"></span><span id="g2Time"></span></div>
      <div class="field" id="field"></div>
      <div class="gameover" id="g2Over"></div>
      <div style="text-align:center;margin-top:10px"><button class="btn sm" id="g2Start"></button></div>
      <p class="hint" data-t="g2Hint"></p>
    </div>
    <div class="card" id="g1card">
      <h2 data-t="gTitle"></h2>
      <div class="gamebar"><span id="gScore"></span><span id="gTime"></span></div>
      <canvas id="game"></canvas>
      <div class="gameover" id="gOver"></div>
      <div style="text-align:center;margin-top:10px"><button class="btn sm" id="gStart"></button></div>
      <p class="hint" data-t="gHint"></p>
    </div>
  </section>

  <section class="page" id="p-album">
    <div class="card">
      <h2 data-t="aTitle"></h2>
      <div class="album" id="album"></div>
    </div>
  </section>

  <footer id="foot"></footer>
</div>

<nav>
  <a href="#home"><span>🏠</span><em data-t="nHome"></em></a>
  <a href="#thu"><span>💌</span><em data-t="nThu"></em></a>
  <a href="#lydo"><span>💭</span><em data-t="nLydo"></em></a>
  <a href="#phieu"><span>🎟️</span><em data-t="nPhieu"></em></a>
  <a href="#album"><span>📸</span><em data-t="nAlbum"></em></a>
  <a href="#game"><span>🎮</span><em data-t="nGame"></em></a>
</nav>

<div class="modal" id="modal">
  <div class="letter">
    <button class="close" id="close" aria-label="close">×</button>
    <h3 id="lTitle"></h3>
    <p id="lBody"></p>
    <div class="sign" id="lSign"></div>
  </div>
</div>

<div class="lightbox" id="lb">
  <button class="close" id="lbClose" aria-label="close">×</button>
  <button class="lb-nav lb-prev" id="lbPrev" aria-label="previous">‹</button>
  <img id="lbImg" alt="">
  <div class="cap" id="lbCap"></div>
  <button class="lb-nav lb-next" id="lbNext" aria-label="next">›</button>
</div>

const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const $ = id => document.getElementById(id);

let lang = store.get("lang","vi");
let localCount = store.get("missCount",0);
let total = null;   // shared online total; null until loaded
let opened = store.get("opened",[]);

/* ---------- shared counter ---------- */
const API = "https://abacus.jasoncameron.dev";
const shownCount = () => total ?? localCount;
async function loadTotal(){
  try{
    const r = await fetch(`${API}/get/${COUNTER_NS}/${COUNTER_KEY}`);
    if (r.status === 404) total = 0;
    else if (r.ok) total = (await r.json()).value;
  }catch(e){}
  renderCount();
}
// send taps one at a time so fast tapping stays under the API's rate limit
let pending = 0, sending = false;
async function flush(){
  if (sending) return; sending = true;
  while (pending > 0){
    try{
      const r = await fetch(`${API}/hit/${COUNTER_NS}/${COUNTER_KEY}`);
      if (!r.ok) throw 0;
      const v = (await r.json()).value;
      pending--;
      total = Math.max(total ?? 0, v + pending);
      renderCount();
    }catch(e){
      if (total === null) { pending = 0; break; }   // offline / blocked: keep local count only
      await new Promise(s=>setTimeout(s,3000));
    }
    await new Promise(s=>setTimeout(s,400));
  }
  sending = false;
}
function renderCount(){
  const n = shownCount();
  $("missCount").innerHTML = n ? T[lang].missCount(n) : "";
}

/* ---------- countdown ---------- */
function tick(){
  const t = T[lang];
  const diff = new Date(NEXT_VISIT) - new Date();
  if (diff <= 0){ $("countdown").innerHTML = `<div class="countdone">${t.cdDone}</div>`; return; }
  const v = [Math.floor(diff/864e5), Math.floor(diff/36e5)%24, Math.floor(diff/6e4)%60, Math.floor(diff/1e3)%60];
  $("countdown").innerHTML = `<div class="count">${v.map((n,i)=>`<div class="unit"><b>${n}</b><span>${t.units[i]}</span></div>`).join("")}</div>`;
}

/* ---------- album ---------- */
// File name becomes the caption: "2026-10-01_di-bien.jpg" -> date "2026-10-01", caption "di bien"
let photos = null, albumState = "idle", lbIdx = 0;
function parsePhoto(f){
  let base = f.name.replace(/\.[^.]+$/,"");
  let date = "";
  const m = base.match(/^(\d{4}-\d{2}-\d{2})[_ -]*(.*)$/);
  if (m){ date = m[1]; base = m[2]; }
  return { src: f.download_url, cap: base.replace(/[_-]+/g," ").trim(), date };
}
async function loadAlbum(){
  if (albumState === "loading" || albumState === "done") return;
  albumState = "loading"; renderAlbum();
  try{
    const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${PHOTO_DIR}`);
    if (r.status === 404){ photos = []; }
    else if (!r.ok) throw 0;
    else {
      const files = await r.json();
      photos = files.filter(f=>f.type==="file" && /\.(jpe?g|png|gif|webp)$/i.test(f.name))
                    .sort((a,b)=>a.name.localeCompare(b.name))
                    .map(parsePhoto);
    }
    albumState = "done";
  }catch(e){ albumState = "error"; }
  renderAlbum();
}
function renderAlbum(){
  const t = T[lang], el = $("album");
  el.innerHTML = "";
  const msg = txt => { el.innerHTML = `<div class="albumMsg" style="grid-column:1/-1"></div>`; el.firstChild.textContent = txt; };
  if (albumState === "loading" || albumState === "idle") return msg(t.aLoading);
  if (albumState === "error") return msg(t.aErr);
  if (!photos.length) return msg(t.aEmpty);
  photos.forEach((p,i)=>{
    const b = document.createElement("button");
    b.className = "polaroid";
    b.innerHTML = `<img loading="lazy" alt=""><span></span><small></small>`;
    b.querySelector("img").src = p.src;
    b.querySelector("span").textContent = p.cap || "💗";
    b.querySelector("small").textContent = p.date;
    b.onclick = ()=>openPhoto(i);
    el.appendChild(b);
  });
}
function openPhoto(i){
  lbIdx = (i + photos.length) % photos.length;
  const p = photos[lbIdx];
  $("lbImg").src = p.src;
  $("lbCap").innerHTML = "<span></span><small></small>";
  $("lbCap").querySelector("span").textContent = p.cap;
  $("lbCap").querySelector("small").textContent = p.date;
  $("lb").classList.add("show");
}
$("lbClose").onclick = ()=>$("lb").classList.remove("show");
$("lbPrev").onclick = e=>{ e.stopPropagation(); openPhoto(lbIdx-1); };
$("lbNext").onclick = e=>{ e.stopPropagation(); openPhoto(lbIdx+1); };
$("lb").onclick = e=>{ if (e.target.id==="lb") $("lb").classList.remove("show"); };
let touchX = null;
$("lb").addEventListener("touchstart",e=>{ touchX = e.touches[0].clientX; });
$("lb").addEventListener("touchend",e=>{
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX; touchX = null;
  if (Math.abs(dx) > 50) openPhoto(lbIdx + (dx < 0 ? 1 : -1));
});
document.addEventListener("keydown",e=>{
  if (!$("lb").classList.contains("show")) return;
  if (e.key==="ArrowRight") openPhoto(lbIdx+1);
  if (e.key==="ArrowLeft") openPhoto(lbIdx-1);
  if (e.key==="Escape") $("lb").classList.remove("show");
});

/* ---------- game ---------- */
const cv = $("game"), ctx = cv.getContext("2d");
let W=0,H=0, basketX=0, items=[], gameScore=0, gameTime=30, gameRunning=false, lastT=0, spawnAcc=0, timerAcc=0;
function sizeCanvas(){
  W = cv.clientWidth; H = cv.clientHeight;
  if (!W) return;
  const dpr = window.devicePixelRatio || 1;
  cv.width = W*dpr; cv.height = H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if (!basketX || basketX > W) basketX = W/2;
  draw();
}
window.addEventListener("resize",sizeCanvas);
function setX(clientX){
  const r = cv.getBoundingClientRect();
  basketX = Math.max(24, Math.min(W-24, clientX - r.left));
  if (!gameRunning) draw();
}
cv.addEventListener("pointermove",e=>setX(e.clientX));
cv.addEventListener("pointerdown",e=>setX(e.clientX));
cv.addEventListener("touchmove",e=>{ setX(e.touches[0].clientX); e.preventDefault(); },{passive:false});

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.font = "28px serif";
  items.forEach(it=>ctx.fillText(it.e, it.x, it.y));
  ctx.font = "40px serif";
  ctx.fillText("🧺", basketX, H-30);
}
function loop(ts){
  if (!gameRunning) return;
  const dt = Math.min(0.05,(ts-lastT)/1000); lastT = ts;
  spawnAcc += dt; timerAcc += dt;
  const rate = 0.55 - (30-gameTime)*0.008;
  if (spawnAcc > rate){
    spawnAcc = 0;
    const star = Math.random() < 0.1;
    items.push({x: 20 + Math.random()*(W-40), y:-20, v: 120 + Math.random()*90 + (30-gameTime)*4,
                e: star ? "⭐" : ["💗","💖","💕"][Math.floor(Math.random()*3)], p: star?3:1});
  }
  if (timerAcc >= 1){ timerAcc -= 1; gameTime--; $("gTime").textContent = T[lang].gTime(gameTime); }
  items.forEach(it=>it.y += it.v*dt);
  items = items.filter(it=>{
    if (it.y > H-50 && it.y < H-10 && Math.abs(it.x-basketX) < 32){
      gameScore += it.p; $("gScore").textContent = T[lang].gScore(gameScore); return false;
    }
    return it.y < H+30;
  });
  draw();
  if (gameTime <= 0) return endGame();
  requestAnimationFrame(loop);
}
function endGame(){
  gameRunning = false; items = []; draw();
  const best = Math.max(store.get("best",0), gameScore); store.set("best",best);
  $("gOver").textContent = T[lang].gOver(gameScore, best);
  $("gStart").textContent = T[lang].gAgain;
  const r = cv.getBoundingClientRect();
  burst(r.left + r.width/2, r.top + r.height/2, ["💗","💕","✨"]);
}
$("gStart").onclick = ()=>{
  if (gameRunning) return;
  sizeCanvas();
  gameScore = 0; gameTime = 30; items = []; spawnAcc = 0; timerAcc = 0;
  $("gScore").textContent = T[lang].gScore(0);
  $("gTime").textContent = T[lang].gTime(30);
  $("gOver").textContent = "";
  gameRunning = true; lastT = performance.now(); requestAnimationFrame(loop);
};

/* ---------- game 2: feed the piggy (whack-a-mole style) ---------- */
const G2_TIME = 30;
const g2 = { score:0, time:G2_TIME, running:false, played:false, timers:[] };
const holes = [];
const PIG = '<span class="pig">🐷<span class="bow">🎀</span></span>';
[["8%","3%"],["86%","2%"],["47%","33%"],["4%","64%"],["90%","66%"],["50%","95%"]].forEach(([l,t],i)=>{
  const d = document.createElement("span"); d.className = "decor"; d.textContent = "🍌";
  d.style.left = l; d.style.top = t; d.style.rotate = (i*55)+"deg"; $("field").appendChild(d);
});
for (let i=0;i<9;i++){
  const h = document.createElement("div"); h.className = "hole";
  const c = document.createElement("span"); c.className = "critter";
  h.appendChild(c); $("field").appendChild(h);
  const hole = {el:h, c, kind:null, hideAt:null};
  c.addEventListener("pointerdown", e=>{ e.preventDefault(); tapHole(hole); });
  holes.push(hole);
}
function bubble(hole, txt){
  const b = document.createElement("span"); b.className = "bubble"; b.textContent = txt;
  hole.el.appendChild(b); setTimeout(()=>b.remove(), 800);
}
function hide(hole){
  hole.c.classList.remove("up","fed");
  hole.kind = null; clearTimeout(hole.hideAt);
}
function tapHole(hole){
  if (!g2.running || !hole.kind) return;
  const t = T[lang], kind = hole.kind;
  hole.kind = null;
  if (kind === "bee"){ g2.score = Math.max(0, g2.score-2); bubble(hole, t.g2Bee); hole.c.textContent = "😵"; }
  else if (kind === "bunch"){ g2.score += 3; bubble(hole, t.g2Bunch); hole.c.classList.add("fed"); }
  else {
    g2.score += 1;
    bubble(hole, t.g2Yum[Math.floor(Math.random()*t.g2Yum.length)]);
    const f = document.createElement("span"); f.className = "flyb"; f.textContent = "🍌";
    hole.el.appendChild(f); setTimeout(()=>f.remove(), 400);
    hole.c.classList.add("fed");
  }
  $("g2Score").textContent = t.g2Score(g2.score);
  clearTimeout(hole.hideAt);
  hole.hideAt = setTimeout(()=>hide(hole), 320);
}
function spawn(){
  if (!g2.running) return;
  const free = holes.filter(h=>!h.c.classList.contains("up"));
  if (free.length){
    const hole = free[Math.floor(Math.random()*free.length)];
    const r = Math.random();
    hole.kind = r < 0.15 ? "bee" : r < 0.27 ? "bunch" : "pig";
    hole.c.innerHTML = hole.kind === "bee" ? "🐝" : hole.kind === "bunch" ? "🍌" : PIG;
    hole.c.classList.add("up");
    const elapsed = G2_TIME - g2.time;
    const stay = Math.max(550, 1100 - elapsed*18) * (hole.kind === "bunch" ? 0.75 : 1);
    hole.hideAt = setTimeout(()=>hide(hole), stay);
  }
  const elapsed = G2_TIME - g2.time;
  g2.timers.push(setTimeout(spawn, Math.max(330, 700 - elapsed*12) * (0.7 + Math.random()*0.6)));
}
function end2(){
  g2.running = false;
  g2.timers.forEach(clearTimeout); g2.timers = [];
  holes.forEach(hide);
  const best = Math.max(store.get("best2",0), g2.score); store.set("best2",best);
  $("g2Over").textContent = T[lang].g2Over(g2.score, best);
  $("g2Start").textContent = T[lang].gAgain;
  const r = $("field").getBoundingClientRect();
  burst(r.left + r.width/2, r.top + r.height/2, ["🍌","🐷","💗"]);
}
$("g2Start").onclick = ()=>{
  if (g2.running) return;
  Object.assign(g2, {score:0, time:G2_TIME, running:true, played:true});
  const t = T[lang];
  $("g2Score").textContent = t.g2Score(0);
  $("g2Time").textContent = t.gTime(G2_TIME);
  $("g2Over").textContent = "";
  spawn();
  const tickId = setInterval(()=>{
    if (!g2.running) return clearInterval(tickId);
    g2.time--; $("g2Time").textContent = T[lang].gTime(g2.time);
    if (g2.time <= 0){ clearInterval(tickId); end2(); }
  },1000);
};
